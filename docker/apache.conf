<VirtualHost *:80>
    ServerName localhost

    # Pass Docker env vars to PHP (getenv() reads these)
    PassEnv CWE_ADMIN_USERNAME
    PassEnv CWE_ADMIN_PASSWORD_HASH
    PassEnv CWE_API_KEYS
    PassEnv CWE_VT_API_KEY
    PassEnv CWE_GREYNOISE_API_KEY
    PassEnv CWE_IPGEOLOCATION_API_KEY
    PassEnv CWE_CONTACT_EMAIL

    # Mount point. Rewritten by docker/entrypoint.sh from CWE_BASE_PATH:
    # a sub-path deployment gets an Alias here, a root deployment gets nothing
    # (DocumentRoot already serves /).
    # BLOCKHARBOR_MOUNT

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Redirect bare root to the app when it is mounted on a sub-path.
    # BLOCKHARBOR_ROOT_REDIRECT

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
